modId="metropolis_itv_patch"
version="1.1.0"
displayName="Metropolis ITV Connector Patch"
authors="Compatibility patch"
description='''
Client-side compatibility patch for Metropolis 0.6.0-beta on Minecraft 1.20.1 under Sinytra Connector.
Replaces the ITV block-entity renderer's Connector-incompatible world tessellation path with a baked-model renderer.
World/block data are untouched. If the safe renderer cannot initialize, ITV rendering is suppressed instead of crashing the client.
'''

